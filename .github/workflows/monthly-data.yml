name: Actualisation mensuelle Sirene
on:
  schedule:
    - cron: '17 5 1 * *' # Le 1er du mois à 05:17 UTC
  workflow_dispatch:
    inputs:
      mois:
        description: 'Mois AAAA-MM à collecter (vide = mois précédent)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: prospection-publication
  cancel-in-progress: false
jobs:
  actualiser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-3
      S3_BUCKET_NAME: prospection-b2b-cmaussang-2026
      DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/prospection.duckdb
      PYTHONUNBUFFERED: "1"
      MOIS_DEMANDE: ${{ inputs.mois }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - name: Vérifier les secrets requis
        run: |
          python - <<'PYCODE'
          import os
          requis = ['INSEE_API_KEY', 'AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY']
          absents = [nom for nom in requis if not os.getenv(nom)]
          if absents:
              raise SystemExit('Secrets GitHub manquants : ' + ', '.join(absents))
          PYCODE
      - name: Installer les dépendances
        run: python -m pip install -r requirements-pipeline.txt
      - name: Récupérer les référentiels déjà présents dans S3
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import boto3
          dossier = Path('data/raw')
          dossier.mkdir(parents=True, exist_ok=True)
          s3 = boto3.client('s3')
          for nom in ['v_commune_2026.csv', 'v_departement_2026.csv', 'v_region_2026.csv']:
              s3.download_file(os.environ['S3_BUCKET_NAME'], f'raw/referentiels/cog/2026/{nom}', str(dossier / nom))
          PY
      - name: Collecter le mois
        run: |
          if [ -n "$MOIS_DEMANDE" ]; then
            python collect_sirene.py --mois "$MOIS_DEMANDE"
          else
            python collect_sirene.py
          fi
      - name: Transférer et vérifier les nouvelles données brutes
        run: python upload_raw_s3.py
      - name: Reconstruire DuckDB depuis toutes les collectes S3
        run: python load_raw_duckdb.py
      - name: Transformer et tester toute la chaîne
        run: dbt build --project-dir dbt_prospection --profiles-dir deployment/dbt
      - name: Publier les résultats pour Streamlit
        run: python export_scores_s3.py
