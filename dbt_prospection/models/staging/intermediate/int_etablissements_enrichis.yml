version: 2

models:
  - name: int_etablissements_enrichis
    description: >
      Établissements Sirene enrichis avec les libellés géographiques
      du COG 2026. Une ligne par SIRET.
      Les jointures conservent tous les établissements du staging,
      quels que soient leur statut de diffusion et la disponibilité
      de leur code postal.

    columns:
      - name: siret
        description: Identifiant unique de l'établissement.
        data_tests:
          - not_null
          - unique

      - name: code_commune
        description: Code commune INSEE fourni par Sirene.

      - name: nom_commune
        description: Nom de la commune ou de l'arrondissement municipal.
        data_tests:
          - not_null

      - name: type_commune
        description: COM pour une commune, ARM pour un arrondissement municipal.

      - name: code_commune_parente
        description: Commune de rattachement d'un arrondissement municipal.

      - name: code_departement
        description: Code du département issu du COG.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['75', '77', '78', '91', '92', '93', '94', '95']

      - name: nom_departement
        description: Libellé officiel du département.
        data_tests:
          - not_null

      - name: code_region
        description: Code région du COG ; 11 pour l'Île-de-France.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['11']

      - name: nom_region
        description: Libellé officiel de la région.
        data_tests:
          - not_null

      - name: code_postal_affiche
        description: Code Sirene prioritaire, sinon indication communale La Poste, ND ou NR.
        data_tests: [not_null]
      - name: source_code_postal
        description: Provenance affichée et exportée ; un code communal ne confirme pas l'adresse.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sirene', 'Commune (La Poste)', 'Commune : plusieurs codes', 'Aucune correspondance']
      - name: codes_postaux_commune
        description: Liste triée des codes distincts de la commune (séparateur virgule).
      - name: nombre_codes_postaux_commune
        data_tests: [not_null]
      - name: date_referentiel_postal
        description: Date UTC de récupération du référentiel, pas sa date de validité historique.
