version: 2

models:
  - name: mart_prospects_scores
    description: >
      Classement commercial V1.1 : bonus transferts confirmés (50 puis 25), selon l'ancienneté et l'activité NAF.
      Les moins de 3 mois et les 9 à moins de 12 mois reçoivent
      100 points d'ancienneté ; les 3 à moins de 9 mois, 50 points.
      
      Bonus NAF : édition 30, conseil 20, programmation 10.
      Orange jusqu'à 80 points inclus, vert à partir de 81.
      À partir de 12 mois, aucun score ni couleur.
      
      Ce classement repose sur des hypothèses commerciales,
      sans estimation de probabilité de conversion.
      Les statuts historiques restent conservés. Les statuts actuels sont vérifiés séparément.
      L’activité et la catégorie juridique ne modifient pas le score.

    columns:
      - name: siret
        description: Identifiant unique de l'établissement.
        data_tests:
          - not_null
          - unique

      - name: date_evaluation
        description: Date commune utilisée pour calculer l'ancienneté.
        data_tests:
          - not_null

      - name: version_score
        description: Version des règles commerciales appliquées.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['v1.1']

      - name: anciennete_jours
        description: Nombre de jours entre création et évaluation.
        data_tests:
          - not_null

      - name: segment_anciennete
        description: Segment commercial défini en mois calendaires.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - lancement
                  - developpement
                  - renouvellement_prospection
                  - hors_perimetre_v1

      - name: score_anciennete
        description: 100 ou 50 points ; NULL hors périmètre.
        data_tests:
          - accepted_values:
              arguments:
                values: [50, 100]
                quote: false

      - name: bonus_naf
        description: Bonus de 10, 20 ou 30 points ; NULL hors périmètre.
        data_tests:
          - accepted_values:
              arguments:
                values: [10, 20, 30]
                quote: false

      - name: score_total
        description: Somme des composantes ; NULL hors périmètre.

      - name: couleur_priorite
        description: Orange ou vert ; NULL hors périmètre.
        data_tests:
          - accepted_values:
              arguments:
                values: ['orange', 'vert']

      - name: angle_commercial
        description: Proposition de message selon le segment d'ancienneté.

      - name: libelle_age
        description: >
          Libellé d'affichage de l'ancienneté :
          Babies avant 3 mois, Newbies de 3 à moins de 9 mois,
          Premiers pas de 9 à moins de 12 mois,
          puis âge en années révolues.
        data_tests:
          - not_null

      - name: etat_activite
        description: Actif, Inactif ou À vérifier à la dernière interrogation Sirene.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Actif', 'Inactif', 'À vérifier']
      - name: activite_confirmee
        description: Filtre d'activité du listing ; ne remplace pas le périmètre d'âge V1.
        data_tests: [not_null]
      - name: date_verification
        description: Date UTC de référence de la vérification administrative.
        data_tests: [not_null]
      - name: categorie_juridique_actuelle
        description: Code Sirene à la dernière vérification ; aucun bonus commercial.
      - name: libelle_categorie_juridique
        description: Libellé simplifié des catégories courantes, sinon code conservé.
        data_tests: [not_null]

      - name: admissible_prospection
        description: >
          Actif à la dernière vérification et aucune procédure collective repérée.
          Filtre de sélection, sans modification du score ; l'âge V1 reste distinct.
        data_tests: [not_null]
      - name: statut_bodacc
        data_tests: [not_null]
      - name: date_verification_bodacc
        data_tests: [not_null]

      - name: nombre_transferts_12_mois
        description: Nombre de transferts admissibles distincts dans la fenêtre.
        data_tests: [not_null]
      - name: bonus_transferts
        description: Bonus appliqué, zéro sans transfert, NULL hors périmètre V1.
      - name: bonus_transferts_potentiel
        description: Bonus événementiel avant application du périmètre d'âge.
        data_tests: [not_null]
